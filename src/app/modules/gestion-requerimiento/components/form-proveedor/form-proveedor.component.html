<section class="req-instancia">
  <header class="req-instancia__cabecera" *ngIf="total > 1 || puedeQuitar">
    <h5 class="req-instancia__titulo">Proveedor {{ indice + 1 }}</h5>
    <button
      type="button"
      class="btn-icon-outline"
      *ngIf="puedeQuitar"
      title="Quitar este proveedor"
      (click)="quitar.emit()"
    >
      <i class="mdi mdi-close" aria-hidden="true"></i>
    </button>
  </header>

  <div class="req-grid req-grid--proveedor">
    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-tipoDoc'">Tipo Documento</label>
      <select
        [id]="prefijo + '-tipoDoc'"
        class="campo-control"
        [name]="prefijo + '-tipoDoc'"
        [(ngModel)]="proveedor.TipoDocumento"
        (ngModelChange)="onTipoDocumentoChange()"
      >
        <option *ngFor="let t of tiposDocumento" [value]="t.valor">{{ t.nombre }}</option>
      </select>
    </div>

    <!-- Documento de identidad de la persona: DNI o carne de extranjeria. El
         label y la longitud salen del tipo; solo el DNI tiene servicio detras. -->
    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-numDoc'">
        {{ etiquetaDocumento }}
      </label>
      <div class="campo-con-boton">
        <input
          [id]="prefijo + '-numDoc'"
          type="text"
          class="campo-control"
          [name]="prefijo + '-numDoc'"
          [attr.maxlength]="longitudDocumento"
          [attr.inputmode]="esCarneExtranjeria ? 'text' : 'numeric'"
          [(ngModel)]="proveedor.Dni"
          (blur)="onDniChange()"
          (keyup.enter)="buscarPersonaReniec()"
        />
        <button
          type="button"
          class="btn btn-app-secundario btn-sm"
          *ngIf="!esCarneExtranjeria"
          title="Consultar RENIEC"
          [disabled]="buscandoPersona"
          (click)="buscarPersonaReniec()"
        >
          <i
            class="mdi"
            [ngClass]="buscandoPersona ? 'mdi-loading mdi-spin' : 'mdi-magnify'"
            aria-hidden="true"
          ></i>
        </button>
      </div>
    </div>

    <!-- El RUC es campo propio y no una opcion del tipo de documento: SIGA
         identifica al contratista por RUC y F004 rechaza emitir la orden de
         servicio sin el (error 51227), asi que se pide siempre, sea el
         proveedor persona natural o juridica. Consultarlo trae la razon social
         y con ella la pantalla cambia de forma. -->
    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-ruc'">RUC</label>
      <div class="campo-con-boton">
        <input
          [id]="prefijo + '-ruc'"
          type="text"
          class="campo-control"
          [name]="prefijo + '-ruc'"
          maxlength="11"
          inputmode="numeric"
          [(ngModel)]="proveedor.Ruc"
          (blur)="onRucChange()"
          (keyup.enter)="buscarEmpresaSunat()"
        />
        <button
          type="button"
          class="btn btn-app-secundario btn-sm"
          title="Consultar SUNAT"
          [disabled]="buscandoEmpresa"
          (click)="buscarEmpresaSunat()"
        >
          <i
            class="mdi"
            [ngClass]="buscandoEmpresa ? 'mdi-loading mdi-spin' : 'mdi-magnify'"
            aria-hidden="true"
          ></i>
        </button>
      </div>
    </div>

    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-tipoReg'">Tipo Registro</label>
      <select
        [id]="prefijo + '-tipoReg'"
        class="campo-control"
        [name]="prefijo + '-tipoReg'"
        [(ngModel)]="proveedor.TipoRegistro"
      >
        <option *ngFor="let t of tiposRegistro" [value]="t.valor">{{ t.nombre }}</option>
      </select>
    </div>

    <!-- Razon social: aparece cuando la consulta a SUNAT devolvio un
         contribuyente, y entonces reemplaza a los tres campos de persona
         natural. SUNAT entrega el nombre en una sola cadena y una empresa no
         tiene apellidos, asi que repartirlo en tres seria inventar. -->
    <div class="campo req-grid__ancho" *ngIf="modoRazonSocial">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-razonSocial'">Razón social</label>
      <input
        [id]="prefijo + '-razonSocial'"
        type="text"
        class="campo-control"
        [name]="prefijo + '-razonSocial'"
        maxlength="250"
        [(ngModel)]="proveedor.RazonSocial"
      />
    </div>

    <!-- Persona natural: los tres campos, tal como los devuelve RENIEC. -->
    <ng-container *ngIf="!modoRazonSocial">
      <div class="campo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-nombres'">Nombres</label>
        <input
          [id]="prefijo + '-nombres'"
          type="text"
          class="campo-control"
          [name]="prefijo + '-nombres'"
          [(ngModel)]="proveedor.Nombres"
        />
      </div>
      <div class="campo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-apePat'">Apellido Paterno</label>
        <input
          [id]="prefijo + '-apePat'"
          type="text"
          class="campo-control"
          [name]="prefijo + '-apePat'"
          [(ngModel)]="proveedor.ApellidoPaterno"
        />
      </div>
      <div class="campo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-apeMat'">Apellido Materno</label>
        <input
          [id]="prefijo + '-apeMat'"
          type="text"
          class="campo-control"
          [name]="prefijo + '-apeMat'"
          [(ngModel)]="proveedor.ApellidoMaterno"
        />
      </div>
    </ng-container>

    <div class="campo req-grid__ancho">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-direccion'">Dirección</label>
      <input
        [id]="prefijo + '-direccion'"
        type="text"
        class="campo-control"
        [name]="prefijo + '-direccion'"
        [(ngModel)]="proveedor.Direccion"
        placeholder="Se completa al buscar el DNI"
      />
    </div>

    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-dpto'">Departamento</label>
      <select
        [id]="prefijo + '-dpto'"
        class="campo-control"
        [name]="prefijo + '-dpto'"
        [(ngModel)]="proveedor.CodDepartamento"
        (ngModelChange)="onDepartamentoChange()"
      >
        <option value="">Seleccione</option>
        <option *ngFor="let d of departamentos" [value]="d.iddpto">{{ d.departamento }}</option>
      </select>
    </div>
    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-prov'">Provincia</label>
      <select
        [id]="prefijo + '-prov'"
        class="campo-control"
        [name]="prefijo + '-prov'"
        [(ngModel)]="proveedor.CodProvincia"
        (ngModelChange)="onProvinciaChange()"
        [disabled]="!proveedor.CodDepartamento"
      >
        <option value="">Seleccione</option>
        <option *ngFor="let p of provincias" [value]="p.idprov">{{ p.provincia }}</option>
      </select>
    </div>
    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-dist'">Distrito</label>
      <select
        [id]="prefijo + '-dist'"
        class="campo-control"
        [name]="prefijo + '-dist'"
        [(ngModel)]="proveedor.CodDistrito"
        (ngModelChange)="onDistritoChange()"
        [disabled]="!proveedor.CodProvincia"
      >
        <option value="">Seleccione</option>
        <option *ngFor="let d of distritos" [value]="d.iddist">{{ d.distrito }}</option>
      </select>
    </div>

    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-celular'">Celular</label>
      <input
        [id]="prefijo + '-celular'"
        type="text"
        class="campo-control"
        [name]="prefijo + '-celular'"
        maxlength="9"
        inputmode="numeric"
        [(ngModel)]="proveedor.Celular"
      />
    </div>
    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-entregables'">Cantidad Entregables</label>
      <input
        [id]="prefijo + '-entregables'"
        type="number"
        min="0"
        class="campo-control"
        [name]="prefijo + '-entregables'"
        [(ngModel)]="proveedor.CantidadEntregables"
      />
    </div>
    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-mensual'">Monto Mensual</label>
      <div class="campo-moneda">
        <span>S/</span>
        <input
          [id]="prefijo + '-mensual'"
          type="number"
          min="0"
          step="0.01"
          class="campo-control"
          [name]="prefijo + '-mensual'"
          [(ngModel)]="proveedor.MontoMensual"
        />
      </div>
    </div>
    <div class="campo">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-total'">Monto Total</label>
      <div class="campo-moneda">
        <span>S/</span>
        <input
          [id]="prefijo + '-total'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-total'"
          [value]="montoTotal | number: '1.2-2'"
          readonly
          tabindex="-1"
        />
      </div>
    </div>

    <div class="campo req-grid__ancho">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-pedido'">N.° Pedido SIGA</label>
      <select
        *ngIf="pedidosConNumero.length; else pedidoTexto"
        [id]="prefijo + '-pedido'"
        class="campo-control"
        [name]="prefijo + '-pedido'"
        [(ngModel)]="proveedor.NumeroPedido"
      >
        <option value="">Seleccione el pedido de esta propuesta</option>
        <option *ngFor="let pedido of pedidosConNumero" [value]="pedido.NumeroPedido">
          {{ pedido.NumeroPedido }}{{ pedido.NombreItemPedido ? ' — ' + pedido.NombreItemPedido : '' }}
        </option>
      </select>
      <ng-template #pedidoTexto>
        <input
          [id]="prefijo + '-pedido'"
          type="text"
          class="campo-control"
          [name]="prefijo + '-pedido'"
          [(ngModel)]="proveedor.NumeroPedido"
        />
      </ng-template>
    </div>

    <div class="campo req-grid__ancho">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-email'">Email</label>
      <input
        [id]="prefijo + '-email'"
        type="email"
        class="campo-control"
        [name]="prefijo + '-email'"
        [(ngModel)]="proveedor.Email"
      />
    </div>
  </div>
</section>
