<section class="req-instancia">
  <header class="req-instancia__cabecera" *ngIf="total > 1 || puedeQuitar">
    <h5 class="req-instancia__titulo">Pedido {{ indice + 1 }}</h5>
    <button
      type="button"
      class="btn-icon-outline"
      *ngIf="puedeQuitar && !soloLectura"
      title="Quitar este pedido"
      (click)="quitar.emit()"
    >
      <i class="mdi mdi-close" aria-hidden="true"></i>
    </button>
  </header>

  <div class="req-grid req-grid--documento">
    <div class="campo req-grid__ancho">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-numero'">
        N° Pedido SIGA<span class="campo-req" aria-hidden="true">*</span>
      </label>
      <select
        [id]="prefijo + '-numero'"
        class="campo-control"
        [class.campo-control--bloqueado]="soloLectura"
        [class.campo-control--invalido]="!!errorCampo['numero']"
        [name]="prefijo + '-numero'"
        [ngModel]="pedido.NumeroPedido"
        (ngModelChange)="onPedidoSeleccionado($event); limpiarError('numero')"
        [disabled]="soloLectura || cargandoPedidos || cargandoDetalle"
      >
        <option value="">{{ cargandoPedidos ? 'Cargando pedidos SIGA…' : 'Seleccione el N° de pedido' }}</option>
        <option *ngFor="let o of opcionesVisibles" [value]="o.NumeroPedido">
          {{ o.MotivoPedido || o.NumeroPedido }}
        </option>
      </select>
      <p class="req-campo-error" *ngIf="errorCampo['numero']">{{ errorCampo['numero'] }}</p>
    </div>

    <div class="campo campo--corto">
      <label class="campo-etiqueta" [attr.for]="prefijo + '-ano'">
        Año<span class="campo-req" aria-hidden="true">*</span>
      </label>
      <input
        [id]="prefijo + '-ano'"
        type="number"
        class="campo-control"
        [class.campo-control--invalido]="!!errorCampo['ano']"
        [name]="prefijo + '-ano'"
        [(ngModel)]="pedido.AnoPedido"
        (ngModelChange)="limpiarError('ano')"
        [readonly]="soloLectura"
        [class.campo-control--bloqueado]="soloLectura"
      />
      <p class="req-campo-error" *ngIf="errorCampo['ano']">{{ errorCampo['ano'] }}</p>
    </div>
  </div>

  <!-- Ruta presupuestaria: importada del SIGA Escritorio; solo lectura. -->
  <div class="req-ruta" *ngIf="pedido.NumeroPedido || soloLectura">
    <h6 class="req-ruta__titulo">Ruta presupuestaria</h6>
    <p class="req-ruta__ayuda">
      Datos de la disponibilidad del SIGA. Solo lectura para evitar inconsistencias de digitación.
    </p>

    <div class="req-grid req-grid--documento">
      <div class="campo req-grid__ancho">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-actividad'">Actividad Operativa</label>
        <input
          [id]="prefijo + '-actividad'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-actividad'"
          [(ngModel)]="pedido.ActividadOperativa"
          readonly
          tabindex="-1"
          placeholder="Se completa al seleccionar el pedido"
        />
      </div>

      <div class="campo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-meta'">Meta Presupuestaria</label>
        <input
          [id]="prefijo + '-meta'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-meta'"
          [(ngModel)]="pedido.MetaPresupuestaria"
          readonly
          tabindex="-1"
          placeholder="Se completa al seleccionar el pedido"
        />
      </div>
      <div class="campo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-ffrr'">Fuente de Financiamiento</label>
        <input
          [id]="prefijo + '-ffrr'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-ffrr'"
          maxlength="2"
          [(ngModel)]="pedido.FuenteFinanc"
          readonly
          tabindex="-1"
          placeholder="Se completa al seleccionar el pedido"
        />
      </div>
      <div class="campo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-clasificador'">Clasificador de Gasto</label>
        <input
          [id]="prefijo + '-clasificador'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-clasificador'"
          [(ngModel)]="pedido.Clasificador"
          readonly
          tabindex="-1"
          placeholder="Se completa al seleccionar el pedido"
        />
      </div>
      <div class="campo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-programa'">Programa</label>
        <input
          [id]="prefijo + '-programa'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-programa'"
          [(ngModel)]="pedido.Programa"
          readonly
          tabindex="-1"
          placeholder="Se completa al seleccionar el pedido"
        />
      </div>
      <div class="campo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-cui'">Código Único de Inversión / CUI</label>
        <input
          [id]="prefijo + '-cui'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-cui'"
          [(ngModel)]="pedido.ProdPy"
          readonly
          tabindex="-1"
          placeholder="Se completa al seleccionar el pedido"
        />
      </div>

      <div class="campo req-grid__ancho" *ngIf="pedido.NombreProyectoSiga">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-proyecto'">Nombre del proyecto</label>
        <input
          [id]="prefijo + '-proyecto'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-proyecto'"
          [(ngModel)]="pedido.NombreProyectoSiga"
          readonly
          tabindex="-1"
        />
      </div>

      <div class="campo req-grid__codigo">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-codigo'">Código del Ítem del Pedido</label>
        <input
          [id]="prefijo + '-codigo'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-codigo'"
          [(ngModel)]="pedido.CodigoItemPedido"
          readonly
          tabindex="-1"
          placeholder="Se completa al seleccionar el pedido"
        />
      </div>
      <div class="campo req-grid__nombre">
        <label class="campo-etiqueta" [attr.for]="prefijo + '-nombre'">Nombre del Ítem del Pedido</label>
        <input
          [id]="prefijo + '-nombre'"
          type="text"
          class="campo-control campo-control--bloqueado"
          [name]="prefijo + '-nombre'"
          [(ngModel)]="pedido.NombreItemPedido"
          readonly
          tabindex="-1"
          placeholder="Se completa al seleccionar el pedido"
        />
      </div>
    </div>
  </div>
</section>
